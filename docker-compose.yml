version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit_dev_password
      POSTGRES_DB: toktickit_db
    ports:
      - "5432:5432"
    volumes:
      - toktickit_pgdata:/var/lib/postgresql/data

volumes:
  toktickit_pgdata:
