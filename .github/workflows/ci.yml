name: CI

on:
  push:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging, "feature/**", "fix/**"]
  pull_request:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma db seed

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test

  e2e-tests:
    name: E2E Tests
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    # TEMPORARY - REMOVE BEFORE MERGE
    strategy:
      # TEMPORARY - REMOVE BEFORE MERGE
      fail-fast: false
      # TEMPORARY - REMOVE BEFORE MERGE
      matrix:
        # TEMPORARY - REMOVE BEFORE MERGE
        attempt: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run database reset (migrations & seed)
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run db:reset

      - name: Run Playwright E2E tests
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: |
          # Start backend separately so we can capture its stdout/stderr
          npm run dev --prefix server > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID" >> /tmp/backend.log

          # Start frontend separately
          npm run dev --prefix client > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!

          # Wait for backend health endpoint (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Wait for frontend (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Run Playwright — webServer.reuseExistingServer=true so it reuses the above processes
          npm run test:e2e
          E2E_EXIT=$?

          # Capture backend/frontend logs as artifacts
          cp /tmp/backend.log backend.log || true
          cp /tmp/frontend.log frontend.log || true

          # Stop background servers
          kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true

          exit $E2E_EXIT

      - name: Upload Playwright test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}-${{ github.run_attempt }}-matrix${{ matrix.attempt }} # TEMPORARY - REMOVE BEFORE MERGE
          path: |
            test-results/
            playwright-report/
            artifacts/
            backend.log
            frontend.log
          retention-days: 14

