name: CI

on:
  push:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging, "feature/**", "fix/**"]
  pull_request:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma db seed

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test

  e2e-tests:
    name: E2E Tests
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    # TEMPORARY - REMOVE BEFORE MERGE
    strategy:
      # TEMPORARY - REMOVE BEFORE MERGE
      fail-fast: false
      # TEMPORARY - REMOVE BEFORE MERGE
      matrix:
        # TEMPORARY - REMOVE BEFORE MERGE
        attempt: [1, 2, 3, 4, 5]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run database reset (migrations & seed)
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run db:reset

      - name: Start backend and frontend
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: |
          mkdir -p ci-logs
          nohup npm run dev --prefix server > ci-logs/backend.log 2>&1 &
          echo $! > ci-logs/backend.pid
          nohup npm run dev --prefix client > ci-logs/frontend.log 2>&1 &
          echo $! > ci-logs/frontend.pid

      - name: Wait for backend and frontend (30 s limit)
        run: |
          DEADLINE=$(( SECONDS + 30 ))
          BACKEND_READY=0
          FRONTEND_READY=0

          while [ $(( SECONDS )) -lt $DEADLINE ]; do
            if [ $BACKEND_READY -eq 0 ]; then
              if ! kill -0 $(cat ci-logs/backend.pid) 2>/dev/null; then
                echo "::error::Backend process died before becoming ready"
                echo "::group::ci-logs/backend.log"
                cat ci-logs/backend.log
                echo "::endgroup::"
                exit 1
              fi
              if curl -sf --max-time 2 http://localhost:3000/api/health > /dev/null; then
                echo "Backend ready after $(( SECONDS ))s"
                BACKEND_READY=1
              fi
            fi

            if [ $FRONTEND_READY -eq 0 ]; then
              if ! kill -0 $(cat ci-logs/frontend.pid) 2>/dev/null; then
                echo "::error::Frontend process died before becoming ready"
                echo "::group::ci-logs/frontend.log"
                cat ci-logs/frontend.log
                echo "::endgroup::"
                exit 1
              fi
              if curl -sf --max-time 2 http://localhost:5173 > /dev/null; then
                echo "Frontend ready after $(( SECONDS ))s"
                FRONTEND_READY=1
              fi
            fi

            if [ $BACKEND_READY -eq 1 ] && [ $FRONTEND_READY -eq 1 ]; then
              echo "Both servers ready"
              exit 0
            fi

            sleep 1
          done

          if [ $BACKEND_READY -eq 0 ]; then
            echo "::error::Backend did not become ready within 30 seconds"
            echo "::group::ci-logs/backend.log"
            cat ci-logs/backend.log
            echo "::endgroup::"
          fi
          if [ $FRONTEND_READY -eq 0 ]; then
            echo "::error::Frontend did not become ready within 30 seconds"
            echo "::group::ci-logs/frontend.log"
            cat ci-logs/frontend.log
            echo "::endgroup::"
          fi
          exit 1

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test:e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}-${{ github.run_attempt }}-matrix${{ matrix.attempt }} # TEMPORARY - REMOVE BEFORE MERGE
          path: |
            ci-logs/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

