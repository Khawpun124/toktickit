name: CI

on:
  push:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging, "feature/**", "fix/**"]
  pull_request:
    branches: [main, lab1-staging, lab2-staging, lab3-staging, lab4-staging]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma db seed

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test

  e2e-tests:
    name: E2E Tests
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run database reset (migrations & seed)
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run db:reset

      - name: Start backend and frontend
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: |
          mkdir -p ci-logs
          nohup npm run dev --prefix server > ci-logs/backend.log 2>&1 &
          echo $! > ci-logs/backend.pid
          nohup npm run dev --prefix client > ci-logs/frontend.log 2>&1 &
          echo $! > ci-logs/frontend.pid

      - name: Wait for backend and frontend (30 s limit)
        run: |
          STATUS=0
          timeout 30 bash .github/scripts/wait-for-servers.sh || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            if [ "$STATUS" -eq 124 ]; then
              echo "::error::Servers were not ready within 30 seconds"
            else
              echo "::error::A server process exited before becoming ready"
            fi
            for name in backend frontend; do
              if [ ! -f "ci-logs/$name.ready" ]; then
                echo "::group::ci-logs/$name.log ($name is not ready)"
                cat "ci-logs/$name.log"
                echo "::endgroup::"
              fi
            done
            exit 1
          fi

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test:e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-logs/
            playwright-report/
            test-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14

