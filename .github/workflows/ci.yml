name: CI

on:
  push:
    branches: [main, lab1-staging, lab2-staging, "feature/**"]
  pull_request:
    branches: [main, lab1-staging, lab2-staging]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit_ci_password
          POSTGRES_DB: toktickit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npx prisma db seed

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://toktickit:toktickit_ci_password@localhost:5432/toktickit_db
        run: npm run test

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test
